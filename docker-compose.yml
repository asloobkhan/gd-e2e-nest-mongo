services:
  nest:
    container_name: nest-mongo-api
    build: .
    depends_on:
      - mongo
    environment:
      APP_ENV: production
      APP_URL: http://localhost
      PORT: 9000
      WEBTOKEN_SECRET_KEY: uAsBw6WxqD
      WEBTOKEN_EXPIRATION_TIME: 2400
      DB_URL: mongodb://mongo:27017/nest
      MCP_SERVER_NAME: nest-rest-mongo-mcp
      MCP_SERVER_VERSION: 1.0.0
      MCP_ALLOWED_MODELS: Profile
    ports:
      - '9000:9000'
    links:
      - mongo
  mongo:
    image: mongo:7
    container_name: nest-mongo-db
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: nest
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
